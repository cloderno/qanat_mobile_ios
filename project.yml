# Xcode-проект собирается из этого файла: brew install xcodegen && xcodegen generate
# Qanat.xcodeproj в git не хранится — правьте этот файл.
name: Qanat
options:
  bundleIdPrefix: com.rating
  deploymentTarget:
    iOS: "17.2"
  developmentLanguage: ru
  knownRegions: [ru, kk, en]
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.1
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
targets:
  Qanat:
    type: application
    platform: iOS
    sources:
      - path: Qanat
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rating.qanatmobile
        PRODUCT_NAME: Qanat
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Qanat/Info.plist
        CODE_SIGN_ENTITLEMENTS: Qanat/Qanat.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATInputs
      - package: Firebase
        product: FirebaseMessaging
      - package: MarkdownUI
        product: MarkdownUI
  QanatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QanatTests]
    dependencies:
      - target: Qanat
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Qanat:
    build:
      targets:
        Qanat: all
        QanatTests: [test]
    test:
      targets: [QanatTests]
